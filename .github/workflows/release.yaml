name: Release

# Tags the head of a release branch as v<.version> (e.g. v0.9.0-0) and publishes a GitHub release.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Release branch to publish (e.g. 0.9.x)
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Tag and publish
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            [0-9]*.[0-9]*.x) ;;
            *) echo "::error::$BRANCH is not a release branch"; exit 1 ;;
          esac

          version=$(sed -n 's/^    \.version = "\(.*\)",$/\1/p' build.zig.zon)
          case "$version" in
            "${BRANCH%.x}".*-[0-9]*) ;;
            *) echo "::error::version '$version' does not belong to $BRANCH"; exit 1 ;;
          esac
          tag="v$version"
          if git ls-remote --exit-code --tags origin "$tag" > /dev/null; then
            echo "::error::$tag already exists; bump the revision first"
            exit 1
          fi

          # Latest earlier tag of the same line; empty for the first release of a line.
          previous=$(git tag -l "v${BRANCH%.x}.*-*" --sort=-v:refname | head -n 1)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "nanoarrow-zig $version"
          git push origin "$tag"

          nanoarrow_version="${version%-*}"
          url="https://github.com/$GITHUB_REPOSITORY"
          {
            echo "Packages nanoarrow $nanoarrow_version (release tarball). Requires Zig 0.17.0+."
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "zig fetch --save $url/archive/refs/tags/$tag.tar.gz"
            echo '```'
            echo
            echo "Then use the dependency from \`build.zig\` as described in the [README]($url/blob/$tag/README.md)."
          } > notes.md

          if [ -n "$previous" ]; then
            changes=$(git log --pretty='- %s' --invert-grep --grep='^Release ' "$previous"..HEAD)
            {
              echo
              echo "## Changes since $previous"
              echo
              echo "${changes:-No changes besides the version bump.}"
              echo
              echo "Full changelog: $url/compare/$previous...$tag"
            } >> notes.md
          else
            {
              echo
              echo "nanoarrow release notes: https://github.com/apache/arrow-nanoarrow/releases/tag/apache-arrow-nanoarrow-$nanoarrow_version"
            } >> notes.md
          fi

          gh release create "$tag" --verify-tag \
            --title "nanoarrow-zig $version (nanoarrow $nanoarrow_version)" \
            --notes-file notes.md
