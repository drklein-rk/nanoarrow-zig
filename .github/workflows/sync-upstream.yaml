name: Sync upstream

# Keeps `main` on the latest apache/arrow-nanoarrow commit. Opens a PR with the new pin, runs the full
# CI on it and merges it when green; a red PR stays open for a human to look at.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: apache/arrow-nanoarrow
  SYNC_BRANCH: sync/upstream
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - name: Bump upstream pin
        id: bump
        run: |
          sha=$(gh api "repos/$UPSTREAM/commits/main" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if grep -q "$sha" build.zig.zon; then
            echo "Already on $sha"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(curl -fsSL "https://raw.githubusercontent.com/$UPSTREAM/$sha/CMakeLists.txt" \
            | sed -n 's/^set(NANOARROW_VERSION "\(.*\)")$/\1/p')
          if [ -z "$version" ]; then
            echo "::error::could not read NANOARROW_VERSION from upstream"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          zig fetch --save=upstream "https://github.com/$UPSTREAM/archive/$sha.tar.gz"
          sed -i "s/^    \.version = \".*\",/    .version = \"$version\",/" build.zig.zon

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git commit -am "Sync nanoarrow upstream to ${sha:0:12} ($version)"
          git push --force origin "$SYNC_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  ci:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yaml
    with:
      ref: sync/upstream

  pull-request:
    needs: [prepare, ci]
    if: always() && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Open or update the sync PR
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          title="Sync nanoarrow upstream to ${SHA:0:12} ($VERSION)"
          body="Automated bump of the upstream pin to https://github.com/$UPSTREAM/commit/$SHA. CI result: $CI_RESULT."
          if [ -z "$(gh pr list --head "$SYNC_BRANCH" --base main --json number --jq '.[0].number')" ]; then
            gh pr create --head "$SYNC_BRANCH" --base main --title "$title" --body "$body"
          else
            gh pr edit "$SYNC_BRANCH" --title "$title" --body "$body"
          fi

          if [ "$CI_RESULT" = "success" ]; then
            gh pr merge "$SYNC_BRANCH" --squash --delete-branch
          else
            gh pr comment "$SYNC_BRANCH" --body "CI did not pass; leaving this PR open for review."
          fi
